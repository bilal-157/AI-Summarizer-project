<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - AI Summarizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h2 { color: #333; margin-bottom: 12px; }
        p { color: #666; line-height: 1.6; margin-bottom: 16px; font-size: 15px; }
        .note {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #667eea;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #5a67d8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📧</div>
        <h2>Check Your Email</h2>
        <p>We've sent a password reset link to your email address. Click the link in the email to reset your password.</p>
        <div class="note">
            💡 Didn't receive it? Check your spam folder or make sure you used the correct email address.
        </div>
        <a href="{% url 'login' %}" class="btn">Back to Login</a>
    </div>
</body>
</html>
